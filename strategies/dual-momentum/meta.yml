og_description: 29 years, 90+ metrics, walk-forward validation, and all the code.
code_note: Everything here runs from a ~400-line Python harness (pandas, numpy, yfinance) with a <code>Strategy</code>
  interface, a one-day-lagged execution engine, a flat cost model, and robustness helpers for parameter
  sweeps, in/out-of-sample splits and walk-forward. Each run writes a single JSON file &mdash; every metric,
  the yearly table, equity and drawdown series, allocation changes &mdash; and that file is what the charts
  and tables above were rendered from.
code_footer: Every strategy in this series emits the same JSON schema, so results are directly comparable
  across articles.
