[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab"
version = "0.4.0"
description = "Backtest harness and strategy library for the Strategy Lab series"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhinav Taduka"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy", "yfinance", "pyarrow", "matplotlib", "PyYAML"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["strategylab*", "sitebuild*"]
